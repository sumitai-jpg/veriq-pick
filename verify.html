<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veriq</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbfbfd;color:#14171c;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.hd{display:flex;align-items:baseline;gap:9px;padding:16px 20px 10px}
.hd b{font-size:16px;letter-spacing:.02em}
.hd span{font-size:11.5px;color:#8b9099}
.body{padding:0 20px 24px}
textarea{width:100%;height:96px;padding:12px 14px;border:1px solid #e3e6ea;border-radius:12px;font:inherit;resize:vertical;outline:none;background:#fff;color:#14171c}
textarea:focus{border-color:#c9ced6}
.row{display:flex;align-items:center;gap:12px;margin-top:10px}
button{background:#14171c;color:#fff;border:0;border-radius:11px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.45;cursor:default}
.s{font-size:11.5px;color:#8b9099}
.res{margin-top:13px}
.sum{padding:11px 14px;background:#fff;border:1px solid #eceef2;border-radius:12px;font-size:12.5px;color:#5b616b;min-height:20px}
.sum b{color:#14171c}
.c{display:flex;gap:10px;padding:12px 14px;background:#fff;border:1px solid #eceef2;border-radius:12px;margin-top:8px}
.mk{flex:0 0 15px;font-weight:700;text-align:center;font-size:14px}
.ok{color:#1a7f4b}.ng{color:#c02b2b}.na{color:#9a9fa8}.wait{color:#c9ced6}
.tx{flex:1;min-width:0;font-size:13px}
.tx a{display:inline-block;font-size:11.5px;color:#3b5bdb;margin-top:3px;text-decoration:none}
.tx small{display:block;font-size:11.5px;color:#8b9099;margin-top:2px}
.c.pend{opacity:.62}
.ft{padding:0 20px 22px;font-size:11.5px;color:#9aa0a8}
</style></head><body>
<div class="hd"><b>Veriq</b><span>主張を1件ずつ出典で確認</span></div>
<div class="body">
  <textarea id="ta" placeholder="検証したい文章を貼る"></textarea>
  <div class="row"><button id="go">検証する</button><span class="s" id="st"></span></div>
  <div class="res" id="res"></div>
</div>
<div class="ft" id="ft">キーはこの端末のブラウザにだけ保存されます。</div>
<script>
(function(){
  var A="https://solene-0e598278.base44.app/functions/veriqVerify";
  var MAXC=6, PAR=3;
  var ta=document.getElementById("ta"),go=document.getElementById("go"),st=document.getElementById("st"),res=document.getElementById("res");
  function key(){
    var k=localStorage.getItem("veriq_key")||"";
    if(!/^vk_[A-Za-z0-9]{10,}$/.test(k)){
      k=(prompt("Veriq のAPIキー（vk_ で始まる文字列）を入力してください。この端末にだけ保存します。")||"").trim();
      if(/^vk_[A-Za-z0-9]{10,}$/.test(k)){localStorage.setItem("veriq_key",k)}else{k=""}
    }
    return k;
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function post(body,timeoutMs){
    var k=key(); if(!k) return Promise.reject(new Error("nokey"));
    var ctl=new AbortController(), id=setTimeout(function(){ctl.abort()},timeoutMs||60000);
    return fetch(A,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},
      body:JSON.stringify(body),signal:ctl.signal})
      .then(function(r){return r.json()}).then(function(j){clearTimeout(id);return j})
      .catch(function(e){clearTimeout(id);throw e});
  }
  function mark(state){
    if(state==="supported")return ["✓","ok"];
    if(state==="contradicted")return ["✕","ng"];
    return ["=","na"];
  }
  function rowHtml(c,state,msg){
    if(state==="wait")return '<div class="c pend"><div class="mk wait">·</div><div class="tx">'+esc(c)+'<small>確認中…</small></div></div>';
    if(state==="error")return '<div class="c"><div class="mk na">=</div><div class="tx">'+esc(c)+'<small>'+esc(msg||"確認できませんでした")+'</small></div></div>';
    var m=mark(state);
    var sub=state==="contradicted"?"記載が矛盾しています":state==="not_stated"?"出典に記載なし":state==="unclear"?"判断できず":"裏付けあり";
    var link=c.url?'<a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+(c.title?esc(c.title)+" · ":"")+'出典を開く</a>':'<small>'+esc(sub)+'</small>';
    return '<div class="c"><div class="mk '+m[1]+'">'+m[0]+'</div><div class="tx">'+esc(c.text)+link+'</div></div>';
  }
  function overall(items){
    var done=items.filter(function(x){return x.state}); if(!done.length) return null;
    var q=done.map(function(x){return x.verdict});
    var label=q.indexOf("unsupported")>=0?"矛盾あり":(done.every(function(x){return x.verdict==="verified"})&&done.length===items.length?"裏付けあり":"一部のみ裏付け");
    var ps=done.filter(function(x){return x.support!=null}).map(function(x){return x.support});
    var trust=ps.length?Math.round(ps.reduce(function(a,b){return a+b},0)/ps.length*100):null;
    return {label:label,trust:trust,done:done.length,total:items.length};
  }
  function run(){
    var text=ta.value.trim(); if(!text){st.textContent="文章が空";return}
    var t0=Date.now(), items=[], sumEl=null;
    go.disabled=1; st.textContent=""; res.innerHTML='<div class="sum" id="sum">主張を抽出中…</div>';
    sumEl=document.getElementById("sum");
    function paint(){
      var o=overall(items);
      if(!o)return;
      var diff=((Date.now()-t0)/1000).toFixed(1);
      sumEl.innerHTML='<b>'+esc(o.label)+'</b>'+(o.trust!=null?" · 支持度 "+o.trust+"%":"")+" · 経過 "+diff+"秒"+(o.done<o.total?" · "+o.done+"/"+o.total+" 完了":"");
    }
    post({text:text,extract_only:true},30000).then(function(j){
      if(!j.ok){throw new Error(j.error||"抽出に失敗")}
      var claims=(j.claims||[]).slice(0,MAXC);
      if(!claims.length)throw new Error("検証可能な主張が見つかりませんでした");
      items=claims.map(function(c){return {text:c,row:document.createElement("div")}});
      items.forEach(function(it){ res.appendChild(it.row); it.row.innerHTML=rowHtml(it.text,"wait"); });
      var i=0, idx=0;
      function worker(){
        if(idx>=items.length)return Promise.resolve();
        var n=idx++, it=items[n];
        return post({claims:[it.text],text:it.text},90000).then(function(r){
          var c=(r.ok&&r.claims&&r.claims[0])?r.claims[0]:null;
          if(!c){it.state="error";it.row.innerHTML=rowHtml(it.text,"error",r&&r.error?r.error:"確認できませんでした");return}
          it.state=c.state; it.verdict=c.verdict; it.support=c.support;
          it.row.innerHTML=rowHtml({text:c.text,url:c.source_url,title:c.source_title},c.state);
          if(r.quota&&r.quota.remaining!=null)st.textContent="残り "+r.quota.remaining+" 回";
          paint();
        }).catch(function(e){
          it.state="error"; it.row.innerHTML=rowHtml(it.text,"error",e&&e.name==="AbortError"?"時間切れ":"通信に失敗");
        }).then(worker);
      }
      return Promise.all(Array.from({length:Math.min(PAR,items.length)},worker));
    }).then(function(){
      go.disabled=0; paint();
      var o=overall(items); if(o) sumEl.innerHTML=sumEl.innerHTML.replace(/ · 経過 [\d.]+秒/,"").replace(/ · \d+\/\d+ 完了/,"")+" · 合計 "+((Date.now()-t0)/1000).toFixed(1)+"秒";
    }).catch(function(e){
      go.disabled=0;
      if(e&&e.message==="nokey"){st.textContent="キー未設定";res.innerHTML="";return}
      st.textContent=(e&&e.message)||"失敗";
      if(sumEl)sumEl.textContent=(e&&e.message)||"失敗";
    });
  }
  go.onclick=run;
  window.addEventListener("message",function(e){
    var d=e.data||{};
    if(d.vq==="text"&&d.text){ta.value=String(d.text).slice(0,500);window.focus();run();}
    if(d.vq==="hi"){try{e.source.postMessage({vq:"ready"},"*")}catch(err){}}
  });
  if(window.opener){try{window.opener.postMessage({vq:"ready"},"*")}catch(e){}}
})();
</script></body></html>
